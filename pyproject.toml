[project]
name = "semente-agents"
version = "0.3.0"
description = "Semente — a multi-agent AI chat framework for land use and agriculture. Pasto Legal was the first seed."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "LAPIG/UFG" }]
keywords = ["ai", "agents", "chat", "agriculture", "land-use", "whatsapp", "geospatial"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "agno==2.6.6",
    "fastapi==0.115.8",
    "uvicorn~=0.34.0",
    "sqlalchemy==2.0.41",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "redis>=7.1.0",
    "google-genai>=2.10.0",
    "ollama>=0.6.1",
    # 1.53+ hard-imports starlette>=0.46 (gzip middleware), which conflicts
    # with fastapi==0.115.8's starlette<0.46 pin. 1.52.x has no starlette dep.
    "streamlit>=1.52.2,<1.53",
    "pydub>=0.25.1",
    "s3fs>=2026.6.0",
    "python-dotenv>=1.2.1",
    "httpx==0.28.1",
    "jinja2>=3.1.6",
    "rich==14.0.0",
    "pyyaml>=6.0",
    "starlette<0.46",
]

[project.optional-dependencies]
gee = [
    "earthengine-api==1.7.4",
    "duckdb==1.3.0",
    "geopandas>=1.1.2",
    "geemap>=0.36.6",
    "xarray>=2026.7.0",
    "xee==0.1.1",
    "zarr>=3.2.1",
    "affine>=2.4.0",
    "numpy>=2.2.0",
    "pyproj>=3.6",
    "shapely>=2.0",
    "pillow>=10.0",
]
geo = [
    "geopandas>=1.1.2",
    "pyproj>=3.6",
    "shapely>=2.0",
    "rarfile>=4.2",
]
knowledge = [
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.2",
]
weather = [
    "openmeteo-requests>=1.3.0",
    "requests-cache>=1.2.0",
    "retry-requests>=1.0.0",
]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
semente = "semente.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["semente"]
